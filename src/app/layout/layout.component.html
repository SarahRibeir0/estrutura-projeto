<nz-layout>
  <nz-header>
    <app-navbar>
      @if(isMobile$ | async){
      <button
        nz-button
        nzType="text"
        (click)="openDrawer()"
        style="color: white; font-size: 24px"
        aria-label="Abrir menu"
      >
        <i nz-icon nzType="menu"></i>
      </button>
      }
    </app-navbar>
  </nz-header>

  <nz-drawer
    [nzVisible]="drawerVisible"
    nzPlacement="left"
    nzClosable="true"
    (nzOnClose)="closeDrawer()"
    [nzWidth]="250"
  >
    <app-sidebar></app-sidebar>
  </nz-drawer>

  <nz-content>
    <router-outlet></router-outlet>
  </nz-content>
</nz-layout>
