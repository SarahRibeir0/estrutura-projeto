<div class="usuario-form">
  <div>
    <h2>Cadastrar Usuário</h2>
  </div>
</div>

<nz-card [nzTitle]="'Cadastrar Usuário'">
  <form nz-form [formGroup]="formUsuario" nzLayout="vertical">
    <div nz-row [nzGutter]="[16, 16]">
      <div nz-col [nzSpan]="6">
        <nz-form-item>
          <nz-form-label nzRequired>Nome</nz-form-label>
          <nz-form-control nzErrorTip="Campo obrigatório!">
            <input nz-input formControlName="nome" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col [nzSpan]="6">
        <nz-form-item>
          <nz-form-label nzRequired>Login</nz-form-label>
          <nz-form-control nzErrorTip="Campo obrigatório!">
            <input nz-input formControlName="login" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <nz-form-item>
          <nz-form-label nzRequired>Senha</nz-form-label>
          <nz-form-control nzErrorTip="Campo obrigatório!">
            <input nz-input formControlName="senha" type="password" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <nz-form-item>
          <nz-form-label nzRequired>Perfil</nz-form-label>
          <nz-form-control nzErrorTip="Campo obrigatório!">
            <input nz-input formControlName="perfil" />
            <!-- <nz-select
              nzShowSearch
              nzAllowClear
              nzPlaceHolder="Selecione o perfil"
              formControlName="perfil"
            >
              <nz-option nzLabel="Administrador" nzValue="Administrador"></nz-option>
              <nz-option nzLabel="Motorista" nzValue="Motorista"></nz-option>
              <nz-option nzLabel="Loja" nzValue="Loja"></nz-option>
            </nz-select> -->
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div class="btn-cadastro">
      <button nz-button nzType="default" (click)="btnCancelar()">
        Cancelar
      </button>
      <button nz-button nzType="primary" (click)="salvar()">
        <span nz-icon nzType="save" nzTheme="outline"></span>
        Salvar
      </button>
    </div>
  </form>
</nz-card>
