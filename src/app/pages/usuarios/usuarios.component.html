<p>usuarios works!!!!</p>
<div>
  <button nz-button nzType="primary">Cadastrar Usuários</button>
</div>

<nz-table #basicTable [nzData]="listOfData">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Login</th>
      <th>Perfi</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    @for (data of basicTable.data; track data) {
    <tr>
      <td>{{ data.name }}</td>
      <td>{{ data.age }}</td>
      <td>{{ data.address }}</td>
      <td>
        <a>Action 一 {{ data.name }}</a>
        <nz-divider nzType="vertical"></nz-divider>
        <a>Delete</a>
      </td>
    </tr>
    }
  </tbody>
</nz-table>
